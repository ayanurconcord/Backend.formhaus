<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formhaus Admin</title>
    <style>
      :root {
        --bg: #111111;
        --panel: #1a1a1a;
        --panel-soft: #242424;
        --accent: #d85c2d;
        --text: #f7f0e8;
        --muted: #b4b4b1;
        --border: rgba(255,255,255,0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: Inter, sans-serif; background: var(--bg); color: var(--text);
      }
      .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px 80px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
      .brand { font-size: 2rem; letter-spacing: .14em; text-transform: uppercase; }
      .button { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
      .button.secondary { background: transparent; border: 1px solid var(--border); }
      .login-card, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
      .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
      input, textarea, select { background: var(--panel-soft); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 1rem; }
      textarea { min-height: 120px; resize: vertical; }
      .hidden { display: none; }
      .tabs { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
      .tab { padding: 10px 16px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; }
      .tab.active { background: var(--accent); border-color: var(--accent); }
      .list { display: grid; gap: 12px; }
      .item { background: rgba(255,255,255,0.02); padding: 18px; border-radius: 16px; border: 1px solid var(--border); }
      .muted { color: var(--muted); }
      .error { color: #ff8c74; }
      .success { color: #9ae6b4; }
      .row { display: flex; gap: 12px; align-items: center; }
      .spacer { flex: 1; }
      @media (max-width: 720px) { .topbar { display: block; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">FORMHAUS</div>
        <div class="row">
          <span id="userBadge" class="muted"></span>
          <button id="logoutButton" class="button secondary hidden">Logout</button>
        </div>
      </div>

      <section id="loginSection" class="login-card">
        <h2>Admin Login</h2>
        <div class="field">
          <label>Email</label>
          <input id="email" type="email" placeholder="admin@formhaus.studio" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="password" type="password" placeholder="admin123" />
        </div>
        <button class="button" id="loginButton">Login</button>
        <p id="loginMessage" class="muted"></p>
      </section>

      <section id="adminSection" class="hidden">
        <div class="tabs">
          <button class="tab active" data-target="tab-settings">Settings</button>
          <button class="tab" data-target="tab-homepage">Homepage</button>
          <button class="tab" data-target="tab-services">Services</button>
          <button class="tab" data-target="tab-projects">Projects</button>
          <button class="tab" data-target="tab-media">Media</button>
          <button class="tab" data-target="tab-about">About</button>
        </div>

        <div id="tab-settings" class="panel tab-panel">
          <h3>Global settings</h3>
          <div class="grid">
            <div class="field"><label>Website name</label><input id="site_name" /></div>
            <div class="field"><label>Accent color</label><input id="accent_color" type="color" /></div>
            <div class="field"><label>Charcoal color</label><input id="charcoal_color" type="color" /></div>
            <div class="field"><label>Bone color</label><input id="bone_color" type="color" /></div>
            <div class="field"><label>Email</label><input id="contact_email" /></div>
            <div class="field"><label>Phone</label><input id="contact_phone" /></div>
            <div class="field"><label>Location</label><input id="contact_address" /></div>
            <div class="field"><label>Instagram</label><input id="social_instagram" /></div>
            <div class="field"><label>LinkedIn</label><input id="social_linkedin" /></div>
            <div class="field"><label>Behance</label><input id="social_behance" /></div>
            <div class="field"><label>Hero title</label><input id="hero_title" /></div>
            <div class="field"><label>Hero description</label><textarea id="hero_description"></textarea></div>
            <div class="field"><label>Primary CTA</label><input id="hero_primary_cta" /></div>
            <div class="field"><label>Primary CTA link</label><input id="hero_primary_link" /></div>
            <div class="field"><label>Secondary CTA</label><input id="hero_secondary_cta" /></div>
            <div class="field"><label>Secondary CTA link</label><input id="hero_secondary_link" /></div>
            <div class="field"><label>SEO title</label><input id="seo_title" /></div>
            <div class="field"><label>SEO description</label><textarea id="seo_description"></textarea></div>
          </div>
          <button class="button" id="saveSettingsButton">Save settings</button>
        </div>

        <div id="tab-homepage" class="panel tab-panel hidden">
          <h3>Homepage sections</h3>
          <div id="homepageList" class="list"></div>
          <button class="button" id="saveHomepageButton">Save homepage</button>
        </div>

        <div id="tab-services" class="panel tab-panel hidden">
          <h3>Services</h3>
          <div id="servicesList" class="list"></div>
          <button class="button" id="createServiceButton">Add service</button>
        </div>

        <div id="tab-projects" class="panel tab-panel hidden">
          <h3>Projects</h3>
          <div id="projectsList" class="list"></div>
          <button class="button" id="createProjectButton">Add project</button>
        </div>

        <div id="tab-media" class="panel tab-panel hidden">
          <h3>Media library</h3>
          <input type="file" id="mediaUpload" multiple />
          <button class="button" id="uploadMediaButton">Upload files</button>
          <div id="mediaList" class="list"></div>
        </div>

        <div id="tab-about" class="panel tab-panel hidden">
          <h3>About page</h3>
          <div class="field"><label>Title</label><input id="about_title" /></div>
          <div class="field"><label>Content</label><textarea id="about_content"></textarea></div>
          <div class="field"><label>SEO title</label><input id="about_seo_title" /></div>
          <div class="field"><label>SEO description</label><textarea id="about_seo_description"></textarea></div>
          <button class="button" id="saveAboutButton">Save about page</button>
        </div>
      </section>
    </div>

    <script>
      const API = 'http://localhost:4000/api';
      const getToken = () => localStorage.getItem('formhaus_token');

      const els = {
        loginSection: document.getElementById('loginSection'),
        adminSection: document.getElementById('adminSection'),
        loginMessage: document.getElementById('loginMessage'),
        userBadge: document.getElementById('userBadge'),
        logoutButton: document.getElementById('logoutButton')
      };

      const applyAuth = (user) => {
        if (user) {
          els.loginSection.classList.add('hidden');
          els.adminSection.classList.remove('hidden');
          els.logoutButton.classList.remove('hidden');
          els.userBadge.textContent = `${user.name} • ${user.role}`;
        } else {
          els.loginSection.classList.remove('hidden');
          els.adminSection.classList.add('hidden');
          els.logoutButton.classList.add('hidden');
          els.userBadge.textContent = '';
        }
      };

      const fetchJson = async (url, options = {}) => {
        const token = getToken();
        const res = await fetch(url, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {}),
            ...(token ? { Authorization: `Bearer ${token}` } : {})
          }
        });
        const payload = await res.json();
        if (!res.ok) throw new Error(payload.message || 'Request failed');
        return payload;
      };

      const runAdminAction = async (action, successMessage) => {
        try {
          await action();
          if (successMessage) alert(successMessage);
        } catch (error) {
          alert(error instanceof Error ? error.message : 'Request failed');
        }
      };

      const setTab = (target) => {
        document.querySelectorAll('.tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.target === target));
        document.querySelectorAll('.tab-panel').forEach((panel) => panel.classList.toggle('hidden', panel.id !== target));
      };

      document.querySelectorAll('.tab').forEach((tab) => {
        tab.addEventListener('click', () => setTab(tab.dataset.target));
      });

      const login = async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        try {
          const response = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.message || 'Invalid login');
          localStorage.setItem('formhaus_token', payload.token);
          applyAuth(payload.user);
          await loadAdminData();
        } catch (error) {
          document.getElementById('loginMessage').textContent = error.message;
          document.getElementById('loginMessage').className = 'error';
        }
      };

      document.getElementById('loginButton').addEventListener('click', login);
      document.getElementById('logoutButton').addEventListener('click', () => {
        localStorage.removeItem('formhaus_token');
        applyAuth(null);
      });

      const loadAdminData = async () => {
        const settingsRes = await fetchJson(`${API}/admin/settings`);
        const homeRes = await fetchJson(`${API}/admin/homepage`);
        const servicesRes = await fetchJson(`${API}/admin/services`);
        const projectsRes = await fetchJson(`${API}/admin/projects`);
        const mediaRes = await fetchJson(`${API}/admin/media`);
        const aboutRes = await fetchJson(`${API}/admin/about`);

        const settings = settingsRes.settings;
        Object.entries(settings).forEach(([key, value]) => {
          const node = document.getElementById(key);
          if (node) node.value = value || '';
        });

        const homepageList = document.getElementById('homepageList');
        homepageList.innerHTML = (homeRes.sections || []).map((section) => `
          <div class="item">
            <div class="field"><label>Section key</label><input data-key="section_key" value="${section.section_key || ''}" /></div>
            <div class="field"><label>Title</label><input data-key="title" value="${section.title || ''}" /></div>
            <div class="field"><label>Subtitle</label><input data-key="subtitle" value="${section.subtitle || ''}" /></div>
            <div class="field"><label>Body</label><textarea data-key="body">${section.body || ''}</textarea></div>
            <div class="field"><label>Image URL</label><input data-key="image_url" value="${section.image_url || ''}" /></div>
            <div class="field"><label>CTA text</label><input data-key="cta_text" value="${section.cta_text || ''}" /></div>
            <div class="field"><label>CTA link</label><input data-key="cta_link" value="${section.cta_link || ''}" /></div>
            <div class="field"><label>Enabled</label><input type="checkbox" data-key="enabled" ${Number(section.enabled) ? 'checked' : ''} /></div>
            <div class="field"><label>Sort order</label><input data-key="sort_order" type="number" value="${section.sort_order || 0}" /></div>
          </div>
        `).join('');

        const servicesList = document.getElementById('servicesList');
        servicesList.innerHTML = (servicesRes.services || []).map((service) => `
          <div class="item">
            <div class="field"><label>Name</label><input data-service-id="${service.id}" data-field="name" value="${service.name || ''}" /></div>
            <div class="field"><label>Description</label><textarea data-service-id="${service.id}" data-field="description">${service.description || ''}</textarea></div>
            <div class="field"><label>Image URL</label><input data-service-id="${service.id}" data-field="image" value="${service.image || ''}" /></div>
            <div class="field"><label>Price</label><input data-service-id="${service.id}" data-field="price" value="${service.price || ''}" /></div>
            <div class="field"><label>Visible</label><input type="checkbox" data-service-id="${service.id}" data-field="is_visible" ${Number(service.is_visible) ? 'checked' : ''} /></div>
            <div class="field"><label>Sort order</label><input data-service-id="${service.id}" data-field="sort_order" type="number" value="${service.sort_order || 0}" /></div>
            <div class="row">
              <button class="button" data-save-service="${service.id}">Save service</button>
              <button class="button secondary" data-delete-service="${service.id}">Delete</button>
            </div>
          </div>
        `).join('');

        const projectsList = document.getElementById('projectsList');
        projectsList.innerHTML = (projectsRes.projects || []).map((project) => `
          <div class="item">
            <div class="field"><label>Title</label><input data-project-id="${project.id}" data-field="title" value="${project.title || ''}" /></div>
            <div class="field"><label>Category</label><input data-project-id="${project.id}" data-field="category" value="${project.category || ''}" /></div>
            <div class="field"><label>Description</label><textarea data-project-id="${project.id}" data-field="description">${project.description || ''}</textarea></div>
            <div class="field"><label>Cover image</label><input data-project-id="${project.id}" data-field="cover_image" value="${project.cover_image || ''}" /></div>
            <div class="field"><label>Gallery JSON</label><textarea data-project-id="${project.id}" data-field="gallery">${project.gallery || '[]'}</textarea></div>
            <div class="field"><label>Model URL</label><input data-project-id="${project.id}" data-field="model_url" value="${project.model_url || ''}" /></div>
            <div class="field"><label>Featured</label><input type="checkbox" data-project-id="${project.id}" data-field="featured" ${Number(project.featured) ? 'checked' : ''} /></div>
            <div class="field"><label>Published</label><input type="checkbox" data-project-id="${project.id}" data-field="is_published" ${Number(project.is_published) ? 'checked' : ''} /></div>
            <div class="field"><label>Sort order</label><input data-project-id="${project.id}" data-field="sort_order" type="number" value="${project.sort_order || 0}" /></div>
            <div class="row">
              <button class="button" data-save-project="${project.id}">Save project</button>
              <button class="button secondary" data-delete-project="${project.id}">Delete</button>
            </div>
          </div>
        `).join('');

        const mediaList = document.getElementById('mediaList');
        mediaList.innerHTML = (mediaRes.media || []).map((item) => `
          <div class="item">
            <div class="muted">${item.filename}</div>
            <div class="muted">${item.kind} • ${item.size} bytes</div>
            <img src="http://localhost:4000${item.path}" alt="${item.filename}" style="max-width: 160px; max-height: 160px; display:block; margin-top:8px; border-radius:10px;" />
          </div>
        `).join('');

        const about = aboutRes.page || {};
        document.getElementById('about_title').value = about.title || '';
        document.getElementById('about_content').value = about.content || '';
        document.getElementById('about_seo_title').value = about.seo_title || '';
        document.getElementById('about_seo_description').value = about.seo_description || '';
      };

      document.getElementById('saveSettingsButton').addEventListener('click', async () => {
        await runAdminAction(async () => {
          const payload = {};
          ['site_name','accent_color','charcoal_color','bone_color','contact_email','contact_phone','contact_address','social_instagram','social_linkedin','social_behance','hero_title','hero_description','hero_primary_cta','hero_primary_link','hero_secondary_cta','hero_secondary_link','seo_title','seo_description'].forEach((key) => {
            payload[key] = document.getElementById(key).value;
          });

          await fetchJson(`${API}/admin/settings`, { method: 'PUT', body: JSON.stringify(payload) });
        }, 'Settings saved');
      });

      document.getElementById('saveHomepageButton').addEventListener('click', async () => {
        await runAdminAction(async () => {
          const sections = [...document.querySelectorAll('#homepageList .item')].map((item) => {
            const get = (field) => item.querySelector(`[data-key="${field}"]`);
            return {
              section_key: get('section_key').value,
              title: get('title').value,
              subtitle: get('subtitle').value,
              body: get('body').value,
              image_url: get('image_url').value,
              cta_text: get('cta_text').value,
              cta_link: get('cta_link').value,
              enabled: get('enabled').checked ? 1 : 0,
              sort_order: Number(get('sort_order').value || 0)
            };
          });
          await fetchJson(`${API}/admin/homepage`, { method: 'PUT', body: JSON.stringify({ sections }) });
        }, 'Homepage saved');
      });

      document.getElementById('createServiceButton').addEventListener('click', async () => {
        await runAdminAction(async () => {
          const service = {
            name: 'New service',
            description: 'Describe your new service.',
            image: '',
            price: 'Custom',
            is_visible: 1,
            sort_order: 0
          };
          await fetchJson(`${API}/admin/services`, { method: 'POST', body: JSON.stringify(service) });
          await loadAdminData();
        }, 'Service added');
      });

      document.getElementById('servicesList').addEventListener('click', async (event) => {
        const saveBtn = event.target.closest('[data-save-service]');
        if (saveBtn) {
          const id = saveBtn.dataset.saveService;
          await runAdminAction(async () => {
            const get = (field) => document.querySelector(`[data-service-id="${id}"][data-field="${field}"]`);
            const service = {
              name: get('name').value,
              description: get('description').value,
              image: get('image').value,
              price: get('price').value,
              is_visible: get('is_visible').checked ? 1 : 0,
              sort_order: Number(get('sort_order').value || 0)
            };
            await fetchJson(`${API}/admin/services/${id}`, { method: 'PUT', body: JSON.stringify(service) });
            await loadAdminData();
          }, 'Service saved');
          return;
        }
        const deleteBtn = event.target.closest('[data-delete-service]');
        if (!deleteBtn) return;
        const id = deleteBtn.dataset.deleteService;
        await runAdminAction(async () => {
          await fetchJson(`${API}/admin/services/${id}`, { method: 'DELETE' });
          await loadAdminData();
        }, 'Service deleted');
      });

      document.getElementById('projectsList').addEventListener('click', async (event) => {
        const saveBtn = event.target.closest('[data-save-project]');
        if (saveBtn) {
          const id = saveBtn.dataset.saveProject;
          await runAdminAction(async () => {
            const get = (field) => document.querySelector(`[data-project-id="${id}"][data-field="${field}"]`);
            const project = {
              title: get('title').value,
              category: get('category').value,
              description: get('description').value,
              cover_image: get('cover_image').value,
              gallery: get('gallery').value,
              model_url: get('model_url').value,
              featured: get('featured').checked ? 1 : 0,
              is_published: get('is_published').checked ? 1 : 0,
              sort_order: Number(get('sort_order').value || 0)
            };
            await fetchJson(`${API}/admin/projects/${id}`, { method: 'PUT', body: JSON.stringify(project) });
            await loadAdminData();
          }, 'Project saved');
          return;
        }
        const deleteBtn = event.target.closest('[data-delete-project]');
        if (!deleteBtn) return;
        const id = deleteBtn.dataset.deleteProject;
        await runAdminAction(async () => {
          await fetchJson(`${API}/admin/projects/${id}`, { method: 'DELETE' });
          await loadAdminData();
        }, 'Project deleted');
      });

      document.getElementById('createProjectButton').addEventListener('click', async () => {
        await runAdminAction(async () => {
          const project = {
            title: 'New project',
            category: 'Design',
            description: 'Project description here.',
            cover_image: '',
            gallery: '[]',
            featured: 0,
            is_published: 1,
            sort_order: 0
          };
          await fetchJson(`${API}/admin/projects`, { method: 'POST', body: JSON.stringify(project) });
          await loadAdminData();
        }, 'Project added');
      });

      document.getElementById('uploadMediaButton').addEventListener('click', async () => {
        const files = document.getElementById('mediaUpload').files;
        if (!files.length) return alert('Choose files first');
        await runAdminAction(async () => {
          const formData = new FormData();
          Array.from(files).forEach((file) => formData.append('files', file));
          const res = await fetch(`${API}/admin/media/upload`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${getToken()}` },
            body: formData
          });
          const payload = await res.json();
          if (!res.ok) throw new Error(payload.message || 'Upload failed');
          await loadAdminData();
        }, 'Files uploaded');
      });

      document.getElementById('saveAboutButton').addEventListener('click', async () => {
        await runAdminAction(async () => {
          const payload = {
            title: document.getElementById('about_title').value,
            content: document.getElementById('about_content').value,
            seo_title: document.getElementById('about_seo_title').value,
            seo_description: document.getElementById('about_seo_description').value
          };
          await fetchJson(`${API}/admin/about`, { method: 'PUT', body: JSON.stringify(payload) });
        }, 'About page saved');
      });

      if (getToken()) {
        applyAuth({ name: 'Admin', role: 'admin' });
        loadAdminData().catch((error) => { alert(error.message); });
      }
    </script>
  </body>
</html>
